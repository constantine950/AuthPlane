services:
  postgres:
    image: postgres:16
    container_name: authplane_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  app:
    build: .
    container_name: authplane_app
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_service
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your_jwt_secret_here
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      JWT_ISSUER: authplane
      JWT_AUDIENCE: authplane-client
      NODE_ENV: production
    depends_on:
      - postgres

volumes:
  postgres_data:
